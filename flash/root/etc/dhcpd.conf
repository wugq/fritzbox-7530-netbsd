# DHCP server on the LAN (DHCPD=yes in /etc/router.conf), dhcpd.conf(5).
# /etc/rc writes the LAN's subnet declaration itself, from LAN_ADDR: the
# addresses .100 to .199 of the network (the upper half of a network
# smaller than /24), the router as gateway, and as DNS server when DNS=yes.
# This file holds the rest and is included first.  A file of your own
# with a "subnet" declaration of its own is used as it is instead.

default-lease-time 3600;
max-lease-time 86400;
authoritative;

# without the router's resolver (DNS=no), hand out public ones:
#option domain-name-servers 1.1.1.1, 9.9.9.9;

# fixed addresses:
#host printer {
#	hardware ethernet 00:11:22:33:44:55;
#	fixed-address 192.168.77.20;
#}
