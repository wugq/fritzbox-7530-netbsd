# DHCP server on the LAN (DHCPD=yes in /etc/router.conf)
# the router's own resolver (DNS=yes in /etc/router.conf); without it,
# public resolvers such as 1.1.1.1, 9.9.9.9
option domain-name-servers 192.168.77.1;
default-lease-time 3600;
max-lease-time 86400;
authoritative;

subnet 192.168.77.0 netmask 255.255.255.0 {
	range 192.168.77.100 192.168.77.199;
	option routers 192.168.77.1;
}
