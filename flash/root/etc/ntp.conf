# ntpd(8) for the flash edition (NTP=yes in /etc/router.conf): set the
# clock from the NetBSD pool.  The board has no battery-backed clock, so
# /etc/rc starts ntpd with -g: the first correction may be large.
# Also answers time queries from the LAN (the firewall keeps the WAN out).
pidfile /var/run/ntpd.pid
driftfile /var/db/ntp.drift
logconfig -syncstatus
tos minsane 2
tos minclock 3 maxclock 6
mdnstries 0
restrict default limited kod nomodify notrap nopeer noquery
restrict source nomodify notrap noquery
restrict 127.0.0.1
restrict ::1
pool 2.netbsd.pool.ntp.org iburst
