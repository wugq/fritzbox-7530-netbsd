# Settings of the FRITZ!Box 7530 flash edition, read by /etc/rc.
# The defaults match the test bench in docs/06-building-and-testing.md: the PC on the
# LAN (switch port 4), the M93p on the WAN (switch port 3).

HOSTNAME=fritzbox

# LAN: qcomedma0 = all switch ports except the WAN port
LAN_ADDR="192.168.77.1/24"

# WAN: switch port number (0 = no WAN, every port is LAN).  Ports seen
# from the front: farthest from the DSL jack = 4, next = 3, then 2 and 1.
WAN_PORT=3
WAN_MODE=static			# static, dhcp or pppoe
WAN_ADDR="192.168.78.1/24"	# static only
WAN_GW=""			# static only: default route
PPPOE_USER=""			# pppoe only: the provider's user name,
PPPOE_PASS=""			# password and
PPPOE_AUTH=chap			# authentication, chap or pap

# IPv6 on the LAN, e.g. a unique local address "fd00:77::1/64" (empty: none).
# Router advertisements (rtadvd) give the clients addresses in its prefix.
LAN_ADDR6=""

FIREWALL=yes	# yes: of new connections from the WAN, let only ICMP in (/etc/npf.conf)
NAT=no		# yes: masquerade the LAN behind the WAN address (/etc/npf.conf)
DHCPD=no	# yes: DHCP server on the LAN (/etc/dhcpd.conf)
DNS=yes		# yes: DNS resolver for the LAN (unbound, /etc/unbound/unbound.conf)
NTP=no		# yes: set the clock from the internet (needs a WAN)
