# NAT for the flash edition (NAT=yes in /etc/router.conf): the LAN is
# masqueraded behind the WAN interface's address: vlan2 (WAN_MODE static
# or dhcp) or pppoe0 (WAN_MODE pppoe).
set bpf.jit off		# no bpfjit module in the image

$lan_net = 192.168.77.0/24

map vlan2 dynamic $lan_net -> ifaddrs(vlan2)
map pppoe0 dynamic $lan_net -> ifaddrs(pppoe0)

# PPPoE takes 8 bytes of each frame (MTU 1492): clamp the TCP MSS so
# that LAN hosts with MTU 1500 do not depend on path MTU discovery
procedure "pppoe" {
	normalize: "max-mss" 1452
}

group "wan-pppoe" on pppoe0 {
	pass final all apply "pppoe"
}

group default {
	pass final all
}
