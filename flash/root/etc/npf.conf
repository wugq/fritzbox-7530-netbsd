# Firewall and NAT of the flash edition (npf.conf(5)).  /etc/rc loads it
# when FIREWALL=yes or NAT=yes in /etc/router.conf, after two changes:
# it defines $lan_net from LAN_ADDR, and it leaves out the lines that end
# in "# NAT" when NAT=no and those that end in "# FIREWALL" when
# FIREWALL=no.  The WAN is vlan2 (WAN_MODE static or dhcp) or pppoe0
# (WAN_MODE pppoe).
set bpf.jit off		# no bpfjit module in the image

# NAT: the LAN leaves with the WAN interface's address
map vlan2 dynamic $lan_net -> ifaddrs(vlan2)			# NAT
map pppoe0 dynamic $lan_net -> ifaddrs(pppoe0)			# NAT

# PPPoE takes 8 bytes of each frame (MTU 1492): clamp the TCP MSS so
# that LAN hosts with MTU 1500 do not depend on path MTU discovery
procedure "pppoe" {
	normalize: "max-mss" 1452
}

# The WAN: connections started from the router or the LAN are tracked
# and their replies let in; of everything else only ICMP comes in
# (ping, and the errors path MTU discovery needs).
group "wan" on vlan2 {
	pass stateful out final all				# FIREWALL
	pass in final proto icmp all				# FIREWALL
	pass in final proto ipv6-icmp all			# FIREWALL
	block in final all					# FIREWALL
	pass final all
}

group "wan-pppoe" on pppoe0 {
	pass stateful out final all apply "pppoe"		# FIREWALL
	pass in final proto icmp all				# FIREWALL
	pass in final proto ipv6-icmp all			# FIREWALL
	block in final all					# FIREWALL
	pass final all apply "pppoe"
}

# the LAN and the loopback interface: everything
group default {
	pass final all
}
