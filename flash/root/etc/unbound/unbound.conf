# unbound.conf(5) of the flash edition (DNS=yes in /etc/router.conf): a
# recursive resolver for the LAN.  /etc/rc writes the addresses it serves
# (from LAN_ADDR, LAN_ADDR6) into /var/run/unbound.local.conf.
# No DNSSEC validation: it needs a trust anchor file kept up to date,
# and the clock set (NTP).
server:
	username: "_unbound"
	chroot: ""
	directory: "/etc/unbound"
	pidfile: "/var/run/unbound.pid"
	use-syslog: yes
	num-threads: 1
	module-config: "iterator"
	msg-cache-size: 4m
	rrset-cache-size: 8m
	hide-identity: yes
	hide-version: yes
	so-sndbuf: 0		# the system default (it asks for 4 MB)
	so-rcvbuf: 0
	access-control: 127.0.0.0/8 allow
	access-control: ::1 allow

include: "/var/run/unbound.local.conf"
